<!doctype html>
<html lang="zh" data-ds-dark-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-composer-display · test harness</title>
<style>
  :root{
    --dsw-alias-label-primary:#1f1e1d;--dsw-alias-label-secondary:#3d3d3a;--dsw-alias-label-tertiary:#8a8780;
    --dsw-alias-border-l1:rgba(31,30,29,.08);--dsw-alias-border-l2:rgba(31,30,29,.14);--dsw-alias-border-l3:rgba(31,30,29,.22);
    --dsw-alias-bg-base:#f7f6f3;--dsw-alias-bg-layer-1:#fff;--dsw-alias-bg-layer-2:#fff;--dsw-alias-bg-module-platform:#eceae5;
    --dsw-alias-interactive-bg-hover:rgba(31,30,29,.06);--dsw-alias-interactive-bg-active:rgba(31,30,29,.1);
    --dsw-alias-state-business-primary:#4d6bfe;--dsw-alias-state-error-primary:#e5484d;--dsw-alias-state-success-primary:#2f9e5b;--dsw-alias-state-warning-primary:#C98A1E;
    --dsw-specific-input-major:#fff;--dsw-specific-menu:#fff;--dsw-elevation-prominent:0 8px 28px rgba(0,0,0,.18);--dsw-elevation-soft:0 2px 10px rgba(0,0,0,.08);
    --dsw-radius-md:12px;--dsw-radius-lg:16px;--dsh-composer-card-max-width:672px;
  }
  html[data-ds-dark-theme]{
    --dsw-alias-label-primary:#ecebe6;--dsw-alias-label-secondary:#c9c7bf;--dsw-alias-label-tertiary:#8a8780;
    --dsw-alias-border-l1:rgba(236,235,230,.08);--dsw-alias-border-l2:rgba(236,235,230,.16);--dsw-alias-border-l3:rgba(236,235,230,.24);
    --dsw-alias-bg-base:#1f1e1d;--dsw-alias-bg-layer-1:#262624;--dsw-alias-bg-layer-2:#2a2a28;--dsw-alias-bg-module-platform:#33322f;
    --dsw-alias-interactive-bg-hover:rgba(236,235,230,.08);--dsw-alias-interactive-bg-active:rgba(236,235,230,.12);
    --dsw-specific-input-major:#2a2a28;--dsw-specific-menu:#2a2a28;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:ui-sans-serif,-apple-system,"PingFang SC",sans-serif;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary)}
  #app{display:flex;flex-direction:column;height:100vh}
  #bar{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--dsw-alias-bg-layer-1);border-bottom:1px solid var(--dsw-alias-border-l2);font-size:12px;flex-wrap:wrap}
  #bar button{font:inherit;padding:4px 10px;border-radius:8px;border:1px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-module-platform);color:inherit;cursor:pointer}
  #bar button:hover{background:var(--dsw-alias-interactive-bg-hover)}
  #metrics{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dsw-alias-label-secondary);white-space:nowrap}
  [data-conversation-scroll]{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 16px;scroll-behavior:auto;position:relative;display:flex;flex-direction:column}
  #transcript{max-width:760px;margin:0 auto;width:100%;padding:16px 0;line-height:1.7;flex:1 1 auto}
  #transcript p{margin:0 0 .6em}
  #seatHost{max-width:760px;margin:0 auto;width:100%;flex:none}
  [data-composer-input]{outline:none;font-size:15px;line-height:1.6;min-height:24px}
  [data-composer-input] p{margin:0}
  [data-composer-placeholder]{position:absolute;color:var(--dsw-alias-label-tertiary);pointer-events:none;font-size:14px}
  [data-input-scroll]{position:relative}
  ._primary_x,._add_x{font:inherit;cursor:pointer}
  [data-composer-stat]{font-size:12px;color:var(--dsw-alias-label-tertiary)}
  #meterSeat button{font:inherit;cursor:pointer;width:22px;height:22px;border-radius:50%;border:1px solid var(--dsw-alias-border-l2);background:transparent;color:inherit}
  #results{position:fixed;right:8px;top:48px;width:340px;max-height:60vh;overflow:auto;margin:0;padding:10px;font:11px/1.5 ui-monospace,Menlo,monospace;background:var(--dsw-alias-bg-layer-2);border:1px solid var(--dsw-alias-border-l2);border-radius:10px;white-space:pre-wrap;z-index:2000;display:none}
</style>
</head>
<body data-ds-dark-theme="">
<div id="app">
  <div id="bar">
    <strong style="font-size:13px">composer harness</strong>
    <button data-act="boot">启动</button>
    <button data-act="markdown">Markdown</button>
    <button data-act="caret">光标</button>
    <button data-act="mode">模式菜单</button>
    <button data-act="model">模型菜单</button>
    <button data-act="tobottom">回到底部</button>
    <button data-act="meter">用量面板</button>
    <button data-act="stream">流式压力</button>
    <button data-act="dispose">卸载/重装</button>
    <button data-act="lang">中/英</button>
    <button data-act="all">全部场景</button>
    <span id="metrics">idle</span>
  </div>
  <div data-conversation-scroll id="scroller">
    <div id="transcript"></div>
    <div id="seatHost"></div>
  </div>
</div>
<pre id="results"></pre>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="harness.js"></script>
<script src="../client.js"></script>
<script src="scenarios.js"></script>
</body>
</html>
